<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Parallel implemented system architecture</title><desc id="desc">React workspace calls the FastAPI access gate. Collaboration, retrieval and approval modules share SQL storage with a leased worker. Optional providers and read-only GitHub imports are separately configured.</desc><rect width="1000" height="520" fill="#F7F5EF"/><g font-family="Arial,sans-serif"><text x="45" y="48" font-size="13" fill="#315C78" letter-spacing="2">PARALLEL / IMPLEMENTED ARCHITECTURE</text><g fill="none" stroke="#aaa69b" stroke-width="2"><path d="M250 140H350M750 165H700V277H650M500 195V250M200 305H800M200 305V350M500 305V350M800 305V350"/></g><g fill="#fff" stroke="#d9d4c8"><rect x="45" y="90" width="205" height="105" rx="3"/><rect x="350" y="90" width="300" height="105" rx="3"/><rect x="750" y="90" width="205" height="105" rx="3"/><rect x="350" y="245" width="300" height="65" rx="3"/><rect x="65" y="350" width="270" height="85" rx="3"/><rect x="365" y="350" width="270" height="85" rx="3"/><rect x="665" y="350" width="270" height="85" rx="3"/></g><g fill="#171717" font-size="20"><text x="65" y="127">React workspace</text><text x="375" y="127">FastAPI access gate</text><text x="775" y="127">Leased worker</text><text x="390" y="285">Shared SQL storage</text><text x="90" y="385">Collaboration</text><text x="390" y="385">Sources &amp; retrieval</text><text x="690" y="385">Runs &amp; approvals</text></g><g fill="#64685f" font-size="14"><text x="65" y="157">Vite · polling UI</text><text x="375" y="157">Live session · origin · membership</text><text x="775" y="157">Payload revalidation</text><text x="90" y="413">Conversations · tasks · decisions</text><text x="390" y="413">Authorized excerpts &amp; citations</text><text x="690" y="413">Exact plans · atomic receipts</text><text x="45" y="495">EXPLANATORY DIAGRAM · Optional read-only GitHub and model adapters are configured separately.</text></g></g></svg>
